server {
    listen       80;
    server_name  localhost;

    # Centralized CORS handling for all locations
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
    add_header Access-Control-Max-Age 1728000 always; # Cache preflight results for 20 days

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    index index.html;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /operators.json$ {
        expires off;
        add_header 'Content-Type' 'application/json' always; 
        add_header Cache-Control "public, max-age=60" always;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public" always;
    }

    brotli_types *;
}