include:
  - project: "l1/game-clients/ci-scripts"
    ref: main
    file: "cocos-3.8.6.gitlab-ci.yml"

variables:
  COCOS_PROJECT_DIR: .
  INTEGRATION_IMAGE: pentagon/l1_spaceflight_client
  INTEGRATION_WS_PATH: spaceflight

unit_test_js:
  before_script:
    - npm set registry http://npm.lumigame.com
    - npm run install-dependencies

.sonar_js:
  before_script:
    - - echo "===========Start Sonar Scanner============="
    - echo $SRC_PATH
    - echo $TEST_PATH
    - cp ./tsconfig.sonar.json ./tsconfig.json
